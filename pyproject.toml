[project]
name = "hrrr-ingest"
version = "0.1.0"
description = "Ingest NOAA HRRR 06z forecasts for a list of points into DuckDB"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "eccodes==2.50.0",
    "eccodeslib>=2.50,<2.51 ; sys_platform != 'win32'",
    "numpy>=2.5.4",
]

[project.scripts]
hrrr-ingest = "hrrr_ingest.cli:run"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mutmut<3",
    "pytest>=9.2.0",
]

[tool.mutmut]
paths_to_mutate = "src/hrrr_ingest/"
tests_dir = "tests/"
# mutmut 2 counts only exit code 1 as "killed", but pytest exits 2 or 4 when a mutant breaks
# collection or conftest import, so every failure is mapped to 1. pytest runs directly in the
# project venv (no `uv run` or shell in between) so that mutmut's timeout kills the test process.
runner = ".venv/bin/python -c 'import sys, pytest; sys.exit(min(pytest.main([\"-x\", \"-q\"]), 1))'"

[tool.pytest.ini_options]
testpaths = ["tests"]
